[tools.'github:espressif/idf-im-ui']
# ESP-IDF Installation Manager (eim). The CLI moved from the archived
# espressif/idf-im-cli repo into espressif/idf-im-ui; select the CLI zip per platform.
version = "0.19.0"
bin = "eim"
platforms.macos-arm64.asset_pattern = "eim-cli-macos-aarch64.zip"
platforms.macos-x64.asset_pattern = "eim-cli-macos-x64.zip"
platforms.linux-arm64.asset_pattern = "eim-cli-linux-aarch64.zip"
platforms.linux-x64.asset_pattern = "eim-cli-linux-x64.zip"

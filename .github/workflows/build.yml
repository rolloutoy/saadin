name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tcsh # ESP/Makefile wants /bin/csh
      - name: Run host tests
        run: |
          make -C ESP test
          make -C ESP/components/ESP32-RevK test

  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        board: [pico, s3, s3eth]
    defaults:
      run:
        shell: bash
    steps:
      - name: Install host tools
        run: |
          apt-get update
          # tcsh is /bin/csh for the build scripts, gcc and popt build revk_settings
          apt-get install -y --no-install-recommends tcsh gcc libc6-dev libpopt-dev
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the firmware version is `git describe`
      - name: Build firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          make -C ESP ${{ matrix.board }}
      - uses: actions/upload-artifact@v7
        with:
          name: Saadin-${{ matrix.board }}
          path: ESP/Saadin-*.bin
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.bin --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
